function initAudio(){
  if(audioCtx) return;

// Ein Ton mit Hüllkurve; freqEnd != null => Gleiten zur Endfrequenz
function tone(freq, dur, type, vol, delay, freqEnd){
  if(!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if(freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(vol ?? 0.14, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}
function playSound(name){
  if(!audioCtx || muted) return;
  switch(name){
    case 'jump':   tone(320, 0.14, 'square',   0.11, 0, 640); break;

const SB_HEADERS = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY };
async function fetchScores(){
  board.status = 'loading'; board.error = '';
  try {
    const url = `${SUPABASE_URL}/rest/v1/highscores?select=name,score&order=score.desc,created_at.asc&limit=10`;
    const res = await fetch(url, { headers: SB_HEADERS });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    board.entries = await res.json();
    board.status = 'ready';
  } catch(err){
    board.status = 'error'; board.error = String(err && err.message || err);
  }
}
async function submitScore(name, score){
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/highscores`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ name, score })
    });
    return res.ok;
  } catch(err){ return false; }
}
function confirmName(){
  const name = (state.nameInput.trim() || 'Broccoli').slice(0, 12);
  state.submitState = 'sending';
  submitScore(name, state.pendingScore).then(ok => {

      state.lastEntry = { name, score: state.pendingScore };
      fetchScores();
      state.screen = 'leaderboard';
    } else {
      state.submitState = 'error';
    }
  });
}

// ===== 9. INPUT =====
const keys = new Set();
addEventListener('keydown', e => {
  initAudio(); // Audio darf erst nach einer Nutzereingabe starten
  // [M] schaltet den Sound stumm — überall verfügbar, ausser während der Namenseingabe
  if((e.key === 'm' || e.key === 'M') && !(state.screen === 'win' && state.submitState === 'input')){
    e.preventDefault(); toggleMute(); return;
  }
  // Namenseingabe am Sieg-Screen
  if(state.screen === 'win' && state.submitState === 'input'){
    e.preventDefault();
    if(e.key === 'Enter'){ confirmName(); }
    else if(e.key === 'Backspace'){ state.nameInput = state.nameInput.slice(0, -1); }
    else if(/^[A-Za-z0-9 ]$/.test(e.key) && state.nameInput.length < 12){ state.nameInput += e.key; }
    return;
  }
  // Sieg-Screen Fehlerzustand
  if(state.screen === 'win' && state.submitState === 'error'){
    e.preventDefault();
    if(e.key === 'Enter'){ confirmName(); }
    else if(e.key === 'Escape'){ state.lastEntry = null; fetchScores(); state.screen = 'leaderboard'; }
    return;
  }
  // Rangliste-Screen: Enter -> Start
  if(state.screen === 'leaderboard'){
    if(e.key === 'Enter'){ e.preventDefault(); board.status = 'idle'; state.screen = 'start'; }
    return;
  }
  // Start-Screen: R = Rangliste neu laden
  if(state.screen === 'start' && (e.key === 'r' || e.key === 'R')){ e.preventDefault(); fetchScores(); return; }
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS','KeyF','Enter'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
const left  = () => keys.has('ArrowLeft')  || keys.has('KeyA');
const right = () => keys.has('ArrowRight') || keys.has('KeyD');
const jumpPressed = () => keys.has('ArrowUp') || keys.has('KeyW') || keys.has('Space');

// ===== 8. PHYSICS =====
function aabb(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function effGravity(){ return CONFIG.GRAVITY * (costume().ability?.gravityMul ?? 1); }
function effJumpV(){ return CONFIG.JUMP_V * (costume().ability?.jumpMul ?? 1); }
// Level-weite Umgebungskräfte auf den Spieler (nicht auf Gegner/Projektile).
// drift/current: ax in px/s (seitliches Schieben) · heat: ay in px/s² (Auftrieb, negativ = nach oben)
function applyEnv(dt){
  const env = currentLevel().env;
  if(!env) return;
  if(env.type === 'drift'){
    player.x += env.ax * dt;
  } else if(env.type === 'current'){
    for(const z of (env.zones || [])) if(aabb(player, z)) player.x += z.ax * dt;
  } else if(env.type === 'heat'){
    for(const z of (env.zones || [])) if(aabb(player, z)) player.vy += z.ay * dt;
  }
}
function movePlayer(dt){
  // horizontal
  if(player.wallJumpTimer > 0){
    // Wandsprung-Impuls: kurz Input ignorieren, damit der Abstoss von der Wand wirkt
    player.wallJumpTimer -= dt;
    player.x += player.vx * dt;
  } else {
    const ab = costume().ability || {};
    const spd = CONFIG.MOVE_SPEED * (ab.speedMul ?? 1);
    let target = 0;
    if(left())  { target = -spd; player.facing = -1; }
    if(right()) { target =  spd; player.facing =  1; }
    if(ab.slippery){
      // Eis: Trägheit statt sofortigem Stopp/Start
      const rate = (target === 0) ? (ab.iceFriction ?? 0.9) : (ab.iceAccel ?? 2.6);
      player.vx += (target - player.vx) * Math.min(1, rate * dt);
      if(target === 0 && Math.abs(player.vx) < 4) player.vx = 0;
    } else {
      player.vx = target;
    }
    player.x += player.vx * dt;
  }
  applyEnv(dt);
  if(costume().ability?.swim){
    // frei steuerbares Schwimmen, gedämpfte „Schwerkraft" (Auftrieb)
    const up = keys.has('ArrowUp')||keys.has('KeyW')||keys.has('Space');
    const down = keys.has('ArrowDown')||keys.has('KeyS');
    const s = costume().ability.swimSpeed;
    player.vy = (up ? -s : down ? s : 40); // leichtes Absinken
    player.y += player.vy * dt;
    // horizontale Bewegung wurde oben schon gesetzt; keine Plattform-Landung nötig, aber Boden begrenzt
    const L = currentLevel();
    if(player.y + player.h > L.groundY){ player.y = L.groundY - player.h; }
    if(player.y < 0) player.y = 0;
    return; // Schwerkraft/Sprung überspringen
  }
  // vertikal: Schwerkraft — Gleiter bremst das Fallen bei gehaltener Sprungtaste
  player.vy += effGravity() * dt;
  const ab2 = costume().ability || {};
  if(ab2.glide && player.vy > 0 && !player.onGround && jumpPressed()){
    player.vy = Math.min(player.vy, ab2.glideFall ?? 90);
  }
  player.y += player.vy * dt;
  // Plattform-Kollision (nur von oben landen)
  player.onGround = false;
  player.touchingWall = 0;
  for(const p of currentLevel().platforms){
    if(aabb(player, p)){
      const prevBottom = (player.y - player.vy*dt) + player.h;
      if(player.vy > 0 && prevBottom <= p.y + 1){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.touchingWall = (player.x < p.x ? -1 : 1);
      }
    }
  }
  // Feuerwehr: Lava ist begehbare Fläche (nur für feuerfeste Kostüme)
  if(costume().ability?.fireproof){
    for(const hz of (currentLevel().hazards||[])){
      if(hz.type==='lava' && aabb(player, hz)){
        const prevBottom = (player.y - player.vy*dt) + player.h;
        if(player.vy > 0 && prevBottom <= hz.y + 1){
          player.y = hz.y - player.h; player.vy = 0; player.onGround = true;
        }
      }
    }
  }
  // Springen mit Doppel-/Wandsprung
  const canDouble = costume().ability?.doubleJump;
  const canWall   = costume().ability?.wallJump;
  const jp = jumpPressed();
  if(jp && !player.jumpHeld){
    if(player.onGround){ player.vy = -effJumpV(); player.jumpsLeft = canDouble?1:0; playSound('jump'); }
    else if(canWall && player.touchingWall){ player.vy = -effJumpV(); player.vx = player.touchingWall*CONFIG.MOVE_SPEED; player.facing = player.touchingWall; player.wallJumpTimer = 0.18; player.jumpsLeft = canDouble?1:0; playSound('jump'); }
    else if(canDouble && player.jumpsLeft>0){ player.vy = -effJumpV()*0.9; player.jumpsLeft--; playSound('jump'); }
  }
  player.jumpHeld = jp;
  if(player.onGround) player.jumpsLeft = canDouble?1:0;
}

function respawn(){
  const c = state.activeCheckpoint;
  player.x = c.x; player.y = c.y; player.vx = 0; player.vy = 0; player.wallJumpTimer = 0;
}
// Startet die Gekocht-Animation; big = letztes Herz verloren (Topf-Variante)
function startCooking(big){
  state.cooking = { t: 0, big: !!big };
  playSound('cook');
}
function hurt(){
  if(invuln > 0 || state.cooking) return;
  state.hearts--; invuln = 1.2;
  state.score = Math.max(0, state.score - CONFIG.DEATH_PENALTY); // Sterben kostet Punkte
  playSound('hurt');
  startCooking(state.hearts <= 0); // Respawn/Level-Neustart erfolgt am Ende der Animation
}
// Wird jeden Frame aufgerufen, solange state.cooking gesetzt ist. Friert das Spiel ein.
function updateCooking(dt){
  const dur = state.cooking.big ? 2.0 : 1.0;
  state.cooking.t += dt;
  if(state.cooking.t >= dur){
    const wasBig = state.cooking.big;
    state.cooking = null;
    if(wasBig) loadLevel(state.levelIndex); // ganzes Level neu (setzt Herzen auf 3)
    else respawn();
  }
}

// ===== 6. ENEMIES =====
// Horizontales Patrouillieren zwischen baseX ± range (von mehreren Typen genutzt)
function patrol(e, dt, speed){
  e.x += e.dir * speed * dt;
  if(e.x > e.baseX + e.range) e.dir = -1;
  if(e.x < e.baseX - e.range) e.dir = 1;
}
function updateEnemies(dt){
  const L = currentLevel();
  for(const e of L.enemies){
    if(!e.alive) continue;
    switch(e.type){
      case 'walker':
        patrol(e, dt, e.speed);
        break;
      case 'hopper': // patrouilliert und hüpft rhythmisch
        patrol(e, dt, e.speed);
        e.y = e.baseY - Math.abs(Math.sin(state.time * Math.PI * e.hopSpeed)) * e.hopHeight;
        break;
      case 'flyer': // schwebt, ignoriert Schwerkraft
        patrol(e, dt, e.speed);
        e.y = e.baseY + Math.sin(state.time * Math.PI * 2 * e.floatSpeed) * e.floatAmp;
        break;
      case 'chaser': { // verfolgt den Spieler in Reichweite, sonst patrouillieren
        const dx = (player.x + player.w/2) - (e.x + e.w/2);
        if(Math.abs(dx) < e.aggroRange){
          e.dir = dx > 0 ? 1 : -1;
          e.x += e.dir * e.chaseSpeed * dt;
          // Verfolgung begrenzen, damit der Gegner sein Revier nicht verlässt
          const limit = e.chaseLimit ?? e.range * 2.5;
          e.x = Math.max(e.baseX - limit, Math.min(e.baseX + limit, e.x));
        } else {
          patrol(e, dt, e.speed);
        }
        break;
      }
      case 'shooter': // stationär, feuert in Intervallen
        e.cooldown = (e.cooldown ?? 0) - dt;
        if(e.cooldown <= 0){
          e.cooldown = e.shootInterval;
          enemyShots.push({
            x: e.x + (e.dir > 0 ? e.w : -14), y: e.y + e.h*0.3,
            w: 14, h: 14, dir: e.dir, speed: e.shotSpeed,
            emoji: e.shotEmoji || '🔸', travelled: 0, range: 400,
          });
        }
        break;
    }
    // Kollision mit Player = Schaden
    if(aabb(player, e)) hurt();
  }
}
// Projektile der shooter-Gegner (nicht abschiessbar)
function updateEnemyShots(dt){
  for(const s of enemyShots){
    const step = s.speed * dt;
    s.x += s.dir * step; s.travelled += step;
    if(aabb(player, s)){ hurt(); s.dead = true; }
  }
  enemyShots = enemyShots.filter(s => !s.dead && s.travelled < s.range);
}

// ===== 6b. HAZARDS =====
// Zeitgesteuerte Typen (fountain/retracting) sind nur im Aktivfenster gefährlich
function hazardActive(hz){
  if(hz.type === 'fountain' || hz.type === 'retracting'){
    return ((state.time + (hz.phase || 0)) % hz.period) < hz.activeTime;
  }
  return true;
}
// Wie weit ist ein zeitgesteuertes Hindernis ausgefahren (0..1)?
function hazardExtend(hz){
  if(!hazardActive(hz)) return 0;
  const elapsed = (state.time + (hz.phase || 0)) % hz.period;
  return Math.min(1, elapsed / (hz.activeTime * 0.35)); // schnelles Ausfahren
}
// Aktuell gefährliche Fläche (fountain/retracting wachsen nach oben aus hz.y heraus)
function hazardRect(hz){
  if(hz.type === 'fountain' || hz.type === 'retracting'){
    const h = hz.maxH * hazardExtend(hz);
    return { x: hz.x, y: hz.y - h, w: hz.w, h: h };
  }
  return hz;
}
// Schadet dieses Hindernis dem aktuellen Kostüm gerade?
function hazardDamages(hz){
  if(!hazardActive(hz)) return false;
  // Lava: Feuerwehr ist immun (und kann darauf laufen) — exklusiver Kostüm-Vorteil.
  // Fontänen schaden allen: ein aktiv ausbrechender Feuerstrahl bleibt gefährlich.
  if(hz.type === 'lava') return !costume().ability?.fireproof;
  return true;
}
function updateHazards(dt){
  const L = currentLevel();
  for(const hz of (L.hazards || [])){
    if(hz.type === 'saw'){
      hz.x += hz.dir * hz.speed * dt;
      if(hz.x > hz.baseX + hz.range) hz.dir = -1;
      if(hz.x < hz.baseX - hz.range) hz.dir = 1;
    } else if(hz.type === 'falling'){
      if(hz.timer > 0){
        hz.timer -= dt;
        if(hz.timer <= 0) hz.y = hz.baseY; // oben neu erscheinen
      } else {
        hz.y += hz.fallSpeed * dt;
        if(hz.y > L.groundY + 60){ hz.timer = hz.respawnDelay; hz.y = -9999; }
      }
    }
  }
}

// ===== 7. PROJECTILES =====
function fireWeapon(){
  if(player.cooldown > 0) return;
  const w = costume().weapon;
  player.cooldown = w.cooldown;
  playSound('shoot');
  projectiles.push({
    x: player.x + (player.facing>0 ? player.w : -10), y: player.y + player.h*0.4,
    w: 18, h: 14, dir: player.facing, speed: w.speed, dmg: w.dmg,
    travelled: 0, range: w.range, emoji: w.emoji,
  });
}
function updateProjectiles(dt){
  const L = currentLevel();
  for(const pr of projectiles){
    if(pr.speed === 0){
      // Nahbereich-Strahl: folgt dem Player, kurze Lebensdauer über range als „Zeit*100"
      pr.x = player.x + (pr.dir>0 ? player.w : -pr.range); pr.w = pr.range; pr.h = 20;
      pr.y = player.y + player.h*0.4;
      pr.travelled += 300*dt;
    } else {
      const step = pr.speed * dt; pr.x += pr.dir*step; pr.travelled += step;
    }
    for(const e of L.enemies){ if(e.alive && aabb(pr, e)){ e.alive=false; state.score+=20; playSound('defeat'); if(pr.speed!==0) pr.dead=true; } }
  }
  projectiles = projectiles.filter(pr => !pr.dead && pr.travelled < pr.range + (pr.speed===0?100:0));
}

// Zeichnet das Kostüm-Accessoire auf/um den Broccoli-Kopf (facing bereits normalisiert nach rechts)
function drawHat(sx, sy, w, look){
  const mid = sx + w/2;
  ctx.fillStyle = look.acc;
  switch(look.hat){
    case 'cap': // Schirmmütze
      ctx.fillRect(sx+6, sy+2, w-12, 5);
      ctx.fillRect(sx+w-11, sy+5, 10, 3);          // Schirm nach vorne
      break;
    case 'helmet': // Astronauten-Glashelm über dem Kopf
      ctx.globalAlpha = 0.30; ctx.beginPath(); ctx.arc(mid, sy+9, 14, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = look.acc; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(mid, sy+9, 14, 0, Math.PI*2); ctx.stroke();
      break;
    case 'mask': // Tauchermaske + Schnorchel
      ctx.fillRect(sx+7, sy+5, w-14, 5);           // Maskenband
      ctx.fillRect(sx+w-5, sy+1, 3, 13);           // Schnorchel seitlich
      break;
    case 'fire': // Feuerwehrhelm (Kappe + Krempe)
      ctx.fillRect(sx+5, sy+2, w-10, 5);
      ctx.fillRect(sx+3, sy+6, w-6, 2);
      break;
    case 'band': // Ninja-Stirnband mit wehenden Bändern
      ctx.fillRect(sx+4, sy+7, w-8, 4);
      ctx.fillRect(sx-4, sy+7, 8, 3);
      ctx.fillRect(sx-7, sy+11, 8, 3);
      break;
    case 'magnet': // Hufeisenmagnet auf dem Kopf
      ctx.fillRect(sx+7, sy+1, 5, 9);
      ctx.fillRect(sx+w-12, sy+1, 5, 9);
      ctx.fillRect(sx+7, sy+8, w-14, 4);
      break;
    case 'wing': // Gleitschirm-Flügel seitlich
      ctx.fillRect(sx+4, sy+4, w-8, 4);
      ctx.fillRect(sx-6, sy+6, 10, 3);
      ctx.fillRect(sx+w-4, sy+6, 10, 3);
      break;
    case 'ice': // Eiskristall-Zacken
      for(let i=0; i<4; i++){
        const bx = sx + 6 + i*((w-14)/3);
        ctx.beginPath(); ctx.moveTo(bx, sy+9); ctx.lineTo(bx+3, sy+1); ctx.lineTo(bx+6, sy+9);
        ctx.closePath(); ctx.fill();
      }
      break;
    case 'bolt': { // Blitz-Zacke über dem Kopf
      const m = sx + w/2;
      ctx.beginPath();
      ctx.moveTo(m-4, sy+11); ctx.lineTo(m+3, sy);   ctx.lineTo(m+1, sy+6);
      ctx.lineTo(m+7, sy+4);  ctx.lineTo(m-1, sy+14); ctx.lineTo(m+1, sy+8);
      ctx.closePath(); ctx.fill();
      break;
    }
    case 'crown': // Krone
      ctx.fillRect(sx+5, sy+7, w-10, 4);
      for(let i=0; i<3; i++){
        const bx = sx + 6 + i*((w-16)/2);
        ctx.beginPath(); ctx.moveTo(bx, sy+7); ctx.lineTo(bx+4, sy); ctx.lineTo(bx+8, sy+7);
        ctx.closePath(); ctx.fill();
      }
      break;
  }
}
// Augen im Broccoli-Kopf (Blick folgt der Laufrichtung, da im gespiegelten Kontext gezeichnet)
function drawEyes(mid, sy){
  const ey = sy + 10;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(mid - 2, ey, 3.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mid + 6, ey, 3.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#16281a';
  ctx.beginPath(); ctx.arc(mid - 1, ey + 0.5, 1.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mid + 7, ey + 0.5, 1.7, 0, Math.PI*2); ctx.fill();
}
// Zeichnet den Broccoli-Spieler als kostümiertes, animiertes Männchen
// (sx/sy = Bildschirm-Position oben-links)
function drawPlayer(sx, sy){
  const w = player.w, h = player.h;
  const look = COSTUME_LOOK[currentLevel().costume] || COSTUME_LOOK.basis;
  const swimming = !!costume().ability?.swim;
  const airborne = !player.onGround && !swimming;
  const moving   = Math.abs(player.vx) > 5 && player.onGround;
  const t = player.animTime;
  // Idle-Wippen (nur im Stand), Schrittphase beim Laufen
  if(!moving && !airborne) sy += Math.sin(t * 3) * 1;
  const step = moving ? Math.sin(t * 12) : 0;
  const mid = sx + w/2;
  ctx.save();
  if(player.facing < 0){ ctx.translate(mid*2, 0); ctx.scale(-1,1); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  // Beine
  ctx.fillStyle = look.leg;
  if(airborne){                                  // Sprung: Beine angezogen
    ctx.fillRect(sx+11,   sy+36, 6, 6);
    ctx.fillRect(sx+w-17, sy+34, 6, 6);
  } else {
    const a = step > 0 ? 3 : 0, b = step > 0 ? 0 : 3;
    ctx.fillRect(sx+10,   sy+37, 6, 7-a);
    ctx.fillRect(sx+w-16, sy+37, 6, 7-b);
    ctx.fillRect(sx+9  + (step>0?2:0), sy+42, 8, 3);   // Füsse
    ctx.fillRect(sx+w-17 - (step>0?0:2), sy+42, 8, 3);
  }
  // Arme
  ctx.fillStyle = look.arm;
  if(swimming){                                  // Schwimmen: Arme seitlich ausgestreckt
    ctx.fillRect(sx-3,   sy+20, 12, 5);
    ctx.fillRect(sx+w-9, sy+20, 12, 5);
  } else if(airborne){                           // Sprung: Arme oben
    ctx.fillRect(sx+2,   sy+13, 6, 12);
    ctx.fillRect(sx+w-8, sy+13, 6, 12);
  } else {                                       // Laufen/Stehen: gegenläufiges Schwingen
    const a = step * 3;
    ctx.fillRect(sx+3,   sy+22+a, 6, 12);
    ctx.fillRect(sx+w-9, sy+22-a, 6, 12);
  }
  // Rumpf mit Licht- und Schattenkante
  ctx.fillStyle = look.body;
  ctx.fillRect(sx+8, sy+20, w-16, 18);
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  ctx.fillRect(sx+8, sy+20, w-16, 3);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(sx+8, sy+35, w-16, 3);
  ctx.fillRect(sx+w-11, sy+20, 3, 18);
  // Gürtel
  ctx.fillStyle = look.belt;
  ctx.fillRect(sx+8, sy+30, w-16, 3);
  // Broccoli-Kopf + Augen
  ctx.font = '26px serif';
  ctx.fillText('🥦', mid, sy+20);
  drawEyes(mid, sy);
  // Kostüm-Accessoire
  drawHat(sx, sy, w, look);
  ctx.restore();
}
// Stacheln: als Emoji-Reihe (falls angegeben) oder als graue Dreiecke
function drawSpikes(x, y, w, h, emoji){
  if(h <= 0) return;
  if(emoji){
    ctx.font = '24px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const n = Math.max(1, Math.round(w/26));
    for(let i=0; i<n; i++) ctx.fillText(emoji, x + (i+0.5)*(w/n), y + h + 6);
    return;
  }
  ctx.fillStyle = '#c9ccd4';
  const n = Math.max(1, Math.round(w/12));
  for(let i=0; i<n; i++){
    const bx = x + i*(w/n), bw = w/n;
    ctx.beginPath();
    ctx.moveTo(bx, y+h); ctx.lineTo(bx + bw/2, y); ctx.lineTo(bx + bw, y+h);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#7a7f8a'; ctx.fillRect(x, y+h-2, w, 2);
}
// Gekocht-Animation: Broccoli wird olivgrün, sinkt zusammen, Dampf steigt auf
function drawCooking(sx, sy){
  const c = state.cooking;
  const dur = c.big ? 2.0 : 1.0;
  const prog = Math.min(1, c.t / dur);
  const squash = prog * (c.big ? 16 : 8);
  const mid = sx + player.w/2;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if(c.big){   // Topf, in den der Broccoli sinkt
    ctx.font = '58px serif';
    ctx.fillText('🍲', mid, sy + 66);
  }
  // Broccoli (sinkt zusammen)
  ctx.font = '26px serif';
  ctx.fillText('🥦', mid, sy + 20 + squash);
  // Oliv-Schleier = „gekocht"
  ctx.globalAlpha = 0.30 + prog * 0.40;
  ctx.fillStyle = '#6b7a33';
  ctx.beginPath(); ctx.arc(mid, sy + 11 + squash, 13, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // Dampfwolken
  for(let i=0; i<4; i++){
    const p = (prog * 1.6 + i * 0.25) % 1;
    ctx.globalAlpha = (1 - p) * 0.75;
    ctx.font = (14 + p*12) + 'px serif';
    ctx.fillText('💨', mid + Math.sin(i + prog*5) * 11, sy + 6 - p*42 + squash);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if(c.big){   // Schriftzug bildschirmfest
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffb84d'; ctx.font = '48px serif';
    ctx.fillText('Gekocht!', CONFIG.W/2, 130);
  }
}
function centerText(lines, colorTitle, startY, lineHeight){

  ctx.fillStyle='#10131f'; ctx.fillRect(0,0,CONFIG.W,CONFIG.H);

}
// Zeichnet die Ranglisten-Box abhängig vom board-Status; highlightName wird hervorgehoben
function drawBoard(cx, topY, highlightName){
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffd23f'; ctx.font = '24px serif';
  ctx.fillText('🏆 Bestenliste', cx, topY);
  ctx.font = '20px serif';
  if(board.status === 'loading' || board.status === 'idle'){
    ctx.fillStyle = '#cfd3dc'; ctx.fillText('lädt …', cx, topY + 36); return;
  }
  if(board.status === 'error'){
    ctx.fillStyle = '#e88'; ctx.fillText('⚠ Rangliste nicht erreichbar', cx, topY + 36);
    ctx.fillStyle = '#cfd3dc'; ctx.fillText('[R] erneut versuchen', cx, topY + 62); return;
  }
  if(board.entries.length === 0){
    ctx.fillStyle = '#cfd3dc'; ctx.fillText('Noch keine Einträge — sei der Erste!', cx, topY + 36); return;
  }
  ctx.textAlign = 'left';
  board.entries.forEach((e, i) => {
    const y = topY + 32 + i*21;

    ctx.fillStyle = isMe ? '#7CFC66' : '#e8e8e8';

    ctx.fillText(`${String(i+1).padStart(2,' ')}.  ${e.name}`, cx - 150, y);
    ctx.textAlign = 'right';
    ctx.fillText(String(e.score), cx + 150, y);
    ctx.textAlign = 'left';
  });
  ctx.textAlign = 'center';
}

function render(){
  if(state.screen==='start'){ return renderStart(); }
  if(state.screen==='win'){ return renderWin(); }
  if(state.screen==='leaderboard'){ return renderLeaderboard(); }
  const L = currentLevel();
  ctx.clearRect(0,0,CONFIG.W,CONFIG.H);
  ctx.fillStyle = L.bg; ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  if(costume().ability?.swim){ ctx.fillStyle='rgba(0,80,160,.15)'; ctx.fillRect(0,0,CONFIG.W,CONFIG.H); }
  const cx = state.cameraX;
  // Boden + Plattformen
  for(const p of L.platforms){
    ctx.fillStyle = (p.y >= L.groundY) ? '#6b4f2a' : '#8a5a2b';
    ctx.fillRect(p.x - cx, p.y, p.w, p.h);
    ctx.fillStyle = '#3fa34d';
    ctx.fillRect(p.x - cx, p.y, p.w, 8);
  }
  // Hindernisse
  for(const hz of (L.hazards||[])){
    if(hz.type === 'lava'){
      ctx.fillStyle='#ff5522'; ctx.fillRect(hz.x-cx, hz.y, hz.w, hz.h);
      ctx.fillStyle='rgba(255,220,120,.45)'; ctx.fillRect(hz.x-cx, hz.y, hz.w, 4);
    } else if(hz.type === 'spikes'){
      drawSpikes(hz.x-cx, hz.y, hz.w, hz.h, hz.emoji);
    } else if(hz.type === 'saw'){
      ctx.save();
      ctx.translate(hz.x-cx + hz.w/2, hz.y + hz.h/2);
      ctx.rotate(state.time * 9);
      ctx.font = '32px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⚙️', 0, 0);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
    } else if(hz.type === 'fountain'){
      const r = hazardRect(hz);
      if(r.h > 0){
        ctx.fillStyle = 'rgba(255,120,30,.85)';
        ctx.fillRect(r.x-cx, r.y, r.w, r.h);
        ctx.fillStyle = 'rgba(255,220,120,.7)';
        ctx.fillRect(r.x-cx + r.w*0.3, r.y, r.w*0.4, r.h);
        ctx.font='26px serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
        ctx.fillText('🔥', r.x-cx + r.w/2, r.y + 22);
      } else {
        ctx.fillStyle = 'rgba(120,60,30,.7)'; ctx.fillRect(hz.x-cx, hz.y-5, hz.w, 5);
      }
    } else if(hz.type === 'falling'){
      if(hz.y > -200){
        ctx.font='28px serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
        ctx.fillText(hz.emoji || '☄️', hz.x-cx + hz.w/2, hz.y + hz.h);
      }
    } else if(hz.type === 'retracting'){
      const r = hazardRect(hz);
      ctx.fillStyle = '#4a4f58'; ctx.fillRect(hz.x-cx, hz.y-2, hz.w, 4);   // Sockel
      drawSpikes(r.x-cx, r.y, r.w, r.h, null);
    }
  }
  // Checkpoints
  ctx.font = '30px serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  for(const c of L.checkpoints) ctx.fillText('🚩', c.x - cx, c.y + 28);
  // Sterne
  ctx.font = '26px serif';
  for(const s of L.stars) ctx.fillText('🌟', s.x - cx + 14, s.y + 24);
  // Ziel
  ctx.font = '40px serif'; ctx.fillText('🏁', L.goalX - cx, L.groundY);

  ctx.font = '30px serif'; ctx.textAlign='center';

  // Projektile (Spieler)
  ctx.font = '20px serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';

  ctx.font = '18px serif';

  // Broccoli-Spieler: Koch-Animation, sonst normal (blinkt bei Unverwundbarkeit)

  ctx.fillText(costume().emoji + '  ' + costume().desc, CONFIG.W/2, CONFIG.H - 14);
  ctx.textAlign = 'left'; ctx.font = '22px serif'; ctx.fillStyle = '#fff';
  if(state.introTimer>0){ ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
    ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='40px serif';
    ctx.fillText('Level '+(state.levelIndex+1)+': '+L.name, CONFIG.W/2, 200);
    ctx.font='30px serif'; ctx.fillText(costume().emoji+' Kostüm bereit!', CONFIG.W/2, 250);
    // Fähigkeit gross und deutlich — das ist der Kern jedes Levels
    ctx.font='23px serif'; ctx.fillStyle='#7CFC66';
    ctx.fillText(costume().desc, CONFIG.W/2, 292);
    ctx.font='22px serif'; ctx.fillStyle='#cfd3dc';
    ctx.fillText('Par-Zeit: '+par+'s — schneller = Extrapunkte', CONFIG.W/2, 330);
    if(state.lastBonus){   // Ergebnis des vorherigen Levels
      ctx.font='24px serif';
      ctx.fillStyle = state.lastBonus.points > 0 ? '#7CFC66' : '#e8a33f';
      ctx.fillText('Vorheriges Level: '+state.lastBonus.time.toFixed(1)+'s  ·  Zeitbonus +'+state.lastBonus.points,
                   CONFIG.W/2, 368);
    }
  }
}

// ===== 11. LOOP =====
let last = 0;
function loop(ts){
  const dt = Math.min(0.033, (ts - last) / 1000 || 0);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
function update(dt){
  if(state.screen === 'start'){
    if(board.status === 'idle') fetchScores();
    if(keys.has('Enter')||keys.has('Space')){
      state.score = 0; state.lastBonus = null;   // neuer Durchlauf startet bei 0
      loadLevel(0); state.screen='play';
    }
    return;
  }
  if(state.screen === 'win' || state.screen === 'leaderboard'){ return; } // Eingaben laufen über keydown
  if(state.screen !== 'play') return;
  const L = currentLevel();
  state.time += dt;            // treibt Hindernis-Phasen und Gegner-Bewegungen
  player.animTime += dt;       // treibt die Spieler-Animation
  if(state.introTimer>0) state.introTimer -= dt;
  else state.levelTime += dt;  // Zeitmessung erst nach der Level-Einblendung
  // Gekocht-Animation friert das Spiel ein (keine Eingaben, keine Gegner-Bewegung)
  if(state.cooking){ updateCooking(dt); return; }
  movePlayer(dt);
  player.cooldown = Math.max(0, (player.cooldown||0) - dt);
  if(keys.has('KeyF')) fireWeapon();
  updateProjectiles(dt);
  if(invuln > 0) invuln -= dt;
  // In Abgrund gefallen?
  if(player.y > L.groundY + 200){ hurt(); }
  // Checkpoint erreichen aktiviert ihn
  for(const c of L.checkpoints){
    if(Math.abs(player.x - c.x) < 30 && player.y < L.groundY){
      state.activeCheckpoint = { x:c.x, y:c.y - player.h };
    }
  }
  updateEnemies(dt);
  updateEnemyShots(dt);
  updateHazards(dt);
  for(const hz of (L.hazards||[])){
    if(hazardDamages(hz) && aabb(player, hazardRect(hz))) hurt();
  }
  // Kamera folgt, geklemmt auf Weltgrenzen
  state.cameraX = Math.max(0, Math.min(player.x + player.w/2 - CONFIG.W/2, L.worldW - CONFIG.W));
  // Magnet-Kostüm zieht Sterne in Reichweite an
  const mag = costume().ability;
  if(mag?.magnet){
    const range = mag.magnetRange ?? 170;
    const pcx = player.x + player.w/2, pcy = player.y + player.h/2;
    for(const s of L.stars){
      const dx = pcx - (s.x + 14), dy = pcy - (s.y + 14);
      const d = Math.hypot(dx, dy);
      if(d < range && d > 0.5){ const pull = 300 * dt; s.x += (dx/d)*pull; s.y += (dy/d)*pull; }
    }
  }
  // Sterne einsammeln
  L.stars = L.stars.filter(s => {
    if(aabb(player, {x:s.x,y:s.y,w:28,h:28})){ state.score += 10; playSound('star'); return false; }
    return true;
  });
  // Ziel erreicht
  if(player.x >= L.goalX){ nextLevel(); }
}
// Zeitbonus: je Sekunde unter der Par-Zeit gibt es Extrapunkte
function awardTimeBonus(){
  const L = currentLevel();
  const par = L.parTime ?? 60;
  const points = Math.max(0, Math.round((par - state.levelTime) * CONFIG.TIME_BONUS_PER_S));
  state.score += points;
  state.lastBonus = { points, time: state.levelTime, par };
  return points;
}
function nextLevel(){
  awardTimeBonus();
  if(state.levelIndex + 1 < LEVELS.length){ playSound('level'); loadLevel(state.levelIndex + 1); }
  else {
    playSound('win');
    state.screen = 'win';
    state.pendingScore = state.score;
    state.nameInput = '';
    state.submitState = 'input';
    state.lastEntry = null;
  }
}
requestAnimationFrame(loop);
</script>
